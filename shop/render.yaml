databases:
  - name: shop-db
    databaseName: shopdb
    user: shopuser
    plan: free

services:
  - type: web
    name: shop-manager
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn shop.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shop-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.4"
